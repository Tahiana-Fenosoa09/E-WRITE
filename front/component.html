<!DOCTYPE html>
<html lang="en">

<head>
    <title>JUST TESTING UK</title>
    <link rel="stylesheet" href="component-style/index.css">
    <link rel="stylesheet" href="component-style/rederecting.css">
    <link rel="stylesheet" href="component-style/typing-game.css">
    <link rel="stylesheet" href="component-style/">
</head>

<body>

    <div class="section-typing">
        <div class="section-typing-container">

            <div class="typing-modal">
                <div class="typing-actions-resume">
                    <button class="typing-actions-button2">
                        Resume
                    </button>
                </div>
            </div>

            <div class="typing-levels">
                <h1>Typing Test</h1>

                <div class="typing-levels-select">
                    <label for="mode">Select Mode :</label>

                    <select id="mode">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>

            <div class="typing-input">

                <div class="typing-input-container">
                    <p id="word-display"></p>
                </div>

                <input type="text" id="input-field" autocomplete="off">

                <p id="results">
                    Time Left : 60s
                </p>

                <div class="typing-actions">
                    <button class="typing-actions-button1">
                        Pause
                    </button>
                </div>

            </div>

            <div class="typing-startgame">
                <button id="start-btn">
                    Start Game
                </button>
            </div>

            <div class="typing-stats">

                <h1 class="typing-stats-advice">
                    Results
                </h1>

                <div class="typing-stats-result">

                    <div class="dashboard-text-child dashboard-text-greetings">
                        <h1>SPEED</h1>
                        <h3 id="final-wpm">-</h3>
                    </div>

                    <div class="dashboard-text-child dashboard-text-quote">
                        <h1>ACCURACY</h1>
                        <h3 id="final-accuracy">-</h3>
                    </div>

                    <div class="dashboard-text-child dashboard-text-goal">
                        <h1>RESUME</h1>
                        <h3 id="final-message">Waiting...</h3>
                    </div>

                </div>

                <div class="typing-stats-actions">
                    <button id="play-again">
                        Play Again
                    </button>

                    <button>
                        Go To Dashboard
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script src="interactivity/script.js"></script>
    <script src="interactivity/typinginteractivity.js"></script>
</body>

</html>
