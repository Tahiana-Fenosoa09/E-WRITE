    <link rel="stylesheet" href="component-style/index.css">

<body>
    <section class="section-game">
        <div class="game-navigation">
            <div class="game-navigation-d">
                <h3><i class="fa-solid fa-home"></i><span>Dashboard</span></h3>
            </div>
            <div class="game-navigation-d">
                <h3><i class="fa-solid fa-people-line"></i><span> Community</span></h3>
            </div>
            <div class="game-navigation-d">
                <h3><i class="fa-solid fa-gamepad"></i><span>Game</span></h3>
            </div>
            <div class="game-navigation-d">
                <h3><i class="fa-solid fa-readme"></i><span>Tutorial</span></h3>
            </div>
            <div class="game-navigation-d">
                <h3><i class="fa-solid fa-list"></i><span>Setting</span></h3>
            </div>
            <div class="game-navigation-d">
                <h3><i class="fa-solid fa-right-to-bracket"></i><span>Log out</span></h3>
            </div>
            <div class="game-navigation-showhide">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </div>
       <div class="game-tutorials">
        <h1>Tutorials</h1>
        <h2>Which one do you prefer?</h2>
        <div class="game-tutorials-choice">
            <div class="game-tutorials-video">
                <h2>Videos
                    <i class="fa-solid fa-play"></i>
                </h2>
            </div>
            <div class="game-tutorials-sheets">
                <h2>Docs
                    <i class="fa-solid fa-book"></i>
                </h2>
            </div>
        </div>
